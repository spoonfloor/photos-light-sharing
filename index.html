<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Photos</title>
    <!-- Generated by scripts/build-share-viewer.sh — do not edit by hand -->
    <link rel="stylesheet" href="css/material-symbols.css?v=1" />
    <link rel="stylesheet" href="css/styles.css?v=2" />
    <link rel="stylesheet" href="css/share-overrides.css?v=12" />
  </head>
  <body class="share-view surface-load-active surface-load-phase-loading filter-chip-rail-visible">
    <div id="appChromeMount">
      <div id="appBarMount">
<!-- App Bar Shell — share viewer (app-only controls hidden at HTML layer). -->
<div class="app-bar-wrapper no-select">
  <div class="app-bar-elements-layer">
    <div class="title-and-back">
      <span class="title title-photos" id="appBarTitle">Photos Light</span>
    </div>

    <div
      class="date-picker"
      data-cap="dateJumper"
      hidden
      aria-hidden="true"
    >
      <span class="date-picker-label">Month</span>
      <select id="monthPicker" class="date-picker-select">
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>

      <span class="date-picker-label">Year</span>
      <select id="yearPicker" class="date-picker-select">
        <!-- Populated by JS -->
      </select>
    </div>

    <div class="actions">
      <button
        type="button"
        class="app-bar-icon-button"
        id="sortToggleBtn"
        aria-label="Sort"
        title="Oldest first"
      >
        <span class="material-symbols-outlined app-bar-icon" id="sortIcon"
          >hourglass_arrow_up</span
        >
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="downloadBtn"
        aria-label="Download"
        title="Download"
        data-cap="downloadInAppBar"
      >
        <span class="material-symbols-outlined app-bar-icon">download</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="addPhotoBtn"
        aria-label="Add Photo"
        title="Add photo"
        data-cap="import"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">add_a_photo</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button inactive"
        id="deselectAllBtn"
        aria-label="Deselect all"
        title="Deselect all"
      >
        <span class="material-symbols-outlined app-bar-icon">cancel</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="editDateBtn"
        aria-label="Edit Date"
        title="Change date"
        data-cap="editDate"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">edit_calendar</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="restoreBtn"
        aria-label="Restore selected"
        title="Restore selected"
        data-cap="restore"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">undo</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="utilitiesBtn"
        aria-label="More options"
        title="More options"
      >
        <span class="material-symbols-outlined app-bar-icon">more_vert</span>
      </button>
    </div>
  </div>
</div>
      </div>
<div class="filter-chip-rail" id="filterChipRail">
  <div class="filter-chip-rail-scroll">
    <button
      type="button"
      class="filter-chip"
      data-filter="starred"
      aria-pressed="false"
    >
      starred
    </button>
    <button
      type="button"
      class="filter-chip"
      data-filter="video"
      aria-pressed="false"
    >
      video
    </button>
  </div>
</div>
    </div>
<!-- Utilities menu — share viewer (Copy link only; no library share flow). -->
<div class="utilities-menu" id="utilitiesMenu" style="display: none">
  <button class="utilities-menu-item" id="clearStarsBtn" type="button" data-cap="star">
    <span class="utilities-menu-icon-composite" aria-hidden="true">
      <span class="material-symbols-outlined">hide_source</span>
      <span class="material-symbols-outlined filled">star</span>
    </span>
    <span>Clear stars</span>
  </button>

  <button
    class="utilities-menu-item"
    id="copyShareLinkBtn"
    type="button"
    data-cap="copyShareLink"
  >
    <span class="material-symbols-outlined">link</span>
    <span>Copy link</span>
  </button>
</div>
    <main class="page-main">
      <div class="page-wrapper">
        <h1 class="share-page-title" id="sharePageTitle"></h1>
        <div id="photoContainer"></div>
        <div class="share-empty" id="shareEmpty" hidden>No photos match these filters.</div>
        <div class="share-error" id="shareError" hidden></div>
      </div>
    </main>
<!-- Lightbox Overlay -->
<div class="lightbox-overlay" id="lightboxOverlay" style="display: none">
  <!-- Top bar with gradient -->
  <div class="lightbox-top-bar">
    <button
      class="lightbox-icon-button"
      id="lightboxBackBtn"
      aria-label="Close"
    >
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="lightbox-spacer"></div>
    <button
      class="lightbox-icon-button"
      id="lightboxRotateBtn"
      aria-label="Rotate"
    >
      <span class="material-symbols-outlined">rotate_left</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxEditDateBtn"
      aria-label="Edit Date"
    >
      <span class="material-symbols-outlined">edit_calendar</span>
    </button>
    <button class="lightbox-icon-button" id="lightboxStarBtn" aria-label="Star">
      <span class="material-symbols-outlined">star</span>
    </button>
    <button class="lightbox-icon-button" id="lightboxInfoBtn" aria-label="Info">
      <span class="material-symbols-outlined">info</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxRestoreBtn"
      aria-label="Restore"
      title="Restore"
      hidden
    >
      <span class="material-symbols-outlined">undo</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxDownloadBtn"
      aria-label="Download"
      title="Download"
    >
      <span class="material-symbols-outlined">download</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxDeleteBtn"
      aria-label="Delete"
    >
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>

  <!-- Navigation chevrons -->
  <button
    class="lightbox-nav-btn lightbox-nav-left"
    id="lightboxPrevBtn"
    aria-label="Previous"
  >
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button
    class="lightbox-nav-btn lightbox-nav-right"
    id="lightboxNextBtn"
    aria-label="Next"
  >
    <span class="material-symbols-outlined">chevron_right</span>
  </button>

  <!-- Photo content -->
  <div class="lightbox-content" id="lightboxContent">
    <!-- Image or video will be inserted here -->
  </div>

  <!-- Info panel at bottom -->
  <div class="lightbox-info-panel" id="lightboxInfoPanel" style="display: none">
    <button class="info-close-btn" id="infoCloseBtn" aria-label="Close">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div class="info-row">
      <span class="info-label">Date:</span>
      <a href="#" class="info-value info-link" id="infoDate">-</a>
    </div>
    <div class="info-row">
      <span class="info-label">Filename:</span>
      <a href="#" class="info-value info-link" id="infoFilename">-</a>
    </div>
  </div>
</div>
<!-- Surface load overlay — scrim visible at t=0 (share hard reload SS2). -->
<div
  class="import-overlay import-overlay--scrim-only"
  id="surfaceLoadOverlay"
  style="display: flex"
  aria-hidden="false"
  data-surface-load-scrim-at=""
>
  <div class="import-card">
    <div class="import-header">
      <span class="import-title" id="surfaceLoadTitle">Loading share page</span>
    </div>

    <div class="import-progress-section">
      <div class="import-status-text">
        <span id="surfaceLoadStatusLabel">Retrieving shared photos and videos.</span>
        <span class="import-spinner" aria-hidden="true"></span>
      </div>
    </div>

    <div class="import-actions" id="surfaceLoadActions" style="display: none">
      <button class="btn btn-secondary" id="surfaceLoadCancelBtn" type="button">
        Cancel
      </button>
    </div>
  </div>
</div>
<script>
  (function () {
    var overlay = document.getElementById('surfaceLoadOverlay');
    var startedAt = performance.now();
    window.__surfaceLoadScrimAt = startedAt;
    if (overlay) {
      overlay.dataset.surfaceLoadScrimAt = String(startedAt);
    }
  })();
</script>
<!-- Toast Notification -->
<div class="toast" id="toast" style="display: none;">
  <span class="toast-message" id="toastMessage"></span>
  <button class="toast-button" id="toastUndoBtn">Undo</button>
  <button class="toast-close-btn" id="toastCloseBtn">
    <span class="material-symbols-outlined">close</span>
  </button>
</div>
<!-- Download prep progress (zip exports only) -->
<div class="import-overlay" id="downloadPrepOverlay" style="display: none">
  <div class="import-card">
    <div class="import-header">
      <span class="import-title" id="downloadPrepTitle">Preparing download</span>
    </div>

    <div class="import-progress-section">
      <div class="import-status-text" id="downloadPrepStatusText">
        Zipping<span class="import-spinner" aria-hidden="true"></span>
      </div>
      <p class="download-prep-note" id="downloadPrepNote">
        Your download will continue even if you close this window.
      </p>
    </div>

    <div class="import-actions">
      <button type="button" class="btn btn-secondary" id="downloadPrepCancelBtn">
        Cancel
      </button>
      <button type="button" class="btn btn-primary" id="downloadPrepCloseBtn">
        Close
      </button>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/viewCapabilities.js"></script>
    <script src="js/gridLayout.js"></script>
    <script src="js/photoSurface/gridTile.js"></script>
    <script src="js/photoSurface/gridSelection.js"></script>
    <script src="js/photoSurface/gridInteractions.js"></script>
    <script src="js/photoSurface/chrome.js"></script>
    <script src="js/photoSurface/filterChipLifecycle.js"></script>
    <script src="js/photoSurface/monthGrid.js"></script>
    <script src="js/photoSurface/simpleGrid.js"></script>
    <script src="js/photoSurface/surfaceSkeletonGrid.js"></script>
    <script src="js/photoSurface/shareSkeletonGrid.js"></script>
    <script src="js/photoSurface/photoGrid.js"></script>
    <script src="js/photoSurface/init.js"></script>
    <script src="js/photoSurface/lightboxMediaCache.js"></script>
    <script src="js/photoSurface/lightboxMedia.js"></script>
    <script src="js/photoSurface/lightboxShell.js"></script>
    <script src="js/photoSurface/surfaceLoadOverlay.js"></script>
    <script src="js/photoSurface/surfaceLoadChrome.js"></script>
    <script src="js/photoSurface/datePickerChrome.js?v=2"></script>
    <script src="js/photoSurface/appBarLayout.js?v=2"></script>
    <script src="js/photoSurface/shareDatePicker.js"></script>
    <script src="js/photoSurface/downloadExport.js"></script>
    <script src="js/shareBoot.js?v=9"></script>
  </body>
</html>
