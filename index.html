<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Photos</title>
    <!-- Generated by scripts/build-share-viewer.sh — do not edit by hand -->
    <link rel="stylesheet" href="css/material-symbols.css?v=1" />
    <link rel="stylesheet" href="css/styles.css?v=18" />
    <link rel="stylesheet" href="css/share-overrides.css?v=14" />
  </head>
  <body class="share-view surface-load-active surface-load-phase-loading filter-chip-rail-visible">
    <div id="appChromeMount">
      <div id="appBarMount">
<!-- App Bar Shell — shared by app and share (build-share-viewer.sh reads
     this file directly). Per-surface differences are data-cap gates,
     resolved by ViewCapabilities.get() + chrome.js's [data-cap] loop —
     not a second copy of this fragment.

     data-cap items that are OFF for some surface ship `hidden` so the
     pre-JS html-first shell never flashes them where they don't belong
     (share must not show add/edit/delete). chrome.js un-hides the ones
     the active surface's caps enable — same mechanism the date-picker
     and #restoreBtn below already rely on. -->
<div class="app-bar-wrapper no-select">
  <div class="app-bar-elements-layer">
    <div class="title-and-back">
      <span
        class="title title-photos"
        id="appBarTitle"
        data-title-short="P/Light"
        >Photos Light</span
      >
    </div>

    <div class="date-picker" data-cap="dateJumper" hidden aria-hidden="true">
      <span class="date-picker-label">Month</span>
      <select id="monthPicker" class="date-picker-select">
        <!-- Populated by JS -->
      </select>

      <span class="date-picker-label">Year</span>
      <select id="yearPicker" class="date-picker-select">
        <!-- Populated by JS -->
      </select>
    </div>

    <div class="actions">
      <button
        type="button"
        class="app-bar-icon-button"
        id="sortToggleBtn"
        aria-label="Sort"
        title="Newest first"
      >
        <span class="material-symbols-outlined app-bar-icon" id="sortIcon"
          >hourglass_arrow_down</span
        >
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="addPhotoBtn"
        aria-label="Add Photo"
        title="Add photo"
        data-cap="import"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">add_a_photo</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button inactive"
        id="downloadBtn"
        aria-label="Download"
        title="Download"
        data-cap="downloadInAppBar"
      >
        <span class="material-symbols-outlined app-bar-icon">download</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button inactive"
        id="deselectAllBtn"
        aria-label="Deselect all"
        title="Deselect all"
      >
        <span class="material-symbols-outlined app-bar-icon">cancel</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="editDateBtn"
        aria-label="Edit Date"
        title="Change date"
        data-cap="editDate"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">edit_calendar</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="restoreBtn"
        aria-label="Restore selected"
        title="Restore selected"
        data-cap="restore"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">undo</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="deleteBtn"
        aria-label="Delete"
        title="Delete selected"
        data-cap="deleteKind"
        hidden
      >
        <span class="material-symbols-outlined app-bar-icon">delete</span>
      </button>

      <button
        type="button"
        class="app-bar-icon-button"
        id="utilitiesBtn"
        aria-label="More options"
        title="More options"
      >
        <span class="material-symbols-outlined app-bar-icon">more_vert</span>
      </button>
    </div>
  </div>
</div>
      </div>
<div class="filter-chip-rail" id="filterChipRail">
  <div class="filter-chip-rail-scroll">
    <button
      type="button"
      class="filter-chip"
      data-filter="starred"
      aria-pressed="false"
    >
      starred
    </button>
    <button
      type="button"
      class="filter-chip"
      data-filter="video"
      aria-pressed="false"
    >
      video
    </button>
  </div>
</div>
    </div>
<!-- Utilities Dropdown Menu — Rebuild thumbnails removed from UI Apr 2026 (capability kept: API + JS below).
     Shared by app and share (build-share-viewer.sh reads this file directly); per-surface items are data-cap gated, not a second fragment. -->
<div class="utilities-menu" id="utilitiesMenu" style="display: none">
  <!-- Narrow width only (hidden by default in styles.css): tap alternative
       to long-press-to-select (see gridInteractions.js) — summons the same
       select-mode overlay. Always floats to the top of the menu (order in
       the narrow block, styles.css), above Download/Change date's own
       float-up. Label/icon swap to "Exit select & star" while overlay is active —
       see chrome.js's updateSelectModeButton. -->
  <button class="utilities-menu-item" id="selectModeBtn" type="button">
    <span class="material-symbols-outlined">check_circle</span>
    <span>Select &amp; star</span>
  </button>

  <button class="utilities-menu-item" id="clearStarsBtn" type="button" data-cap="star">
    <span class="utilities-menu-icon-composite" aria-hidden="true">
      <span class="material-symbols-outlined">hide_source</span>
      <span class="material-symbols-outlined filled">star</span>
    </span>
    <span>Clear stars</span>
  </button>

  <button
    class="utilities-menu-item"
    id="downloadSelectedBtn"
    type="button"
    data-cap="downloadInUtilities"
  >
    <span class="material-symbols-outlined">download</span>
    <span>Download</span>
  </button>

  <!-- Narrow width only (styles.css narrow block sets order: -1/-2 to float
       these two above Clear stars): mirrors the app bar's inline download/
       change-date controls, which hide at this breakpoint. Desktop keeps
       its default DOM order (below Clear stars), unchanged. -->
  <button class="utilities-menu-item" id="editDateSelectedBtn" type="button" data-cap="editDate">
    <span class="material-symbols-outlined">edit_calendar</span>
    <span>Change date</span>
  </button>

  <button class="utilities-menu-item" id="getShareLinkBtn" type="button" data-cap="shareLink">
    <span class="material-symbols-outlined">link</span>
    <span>Get link</span>
  </button>

  <button
    class="utilities-menu-item"
    id="manageShareLinksBtn"
    type="button"
    data-cap="shareLink"
  >
    <span class="material-symbols-outlined">list</span>
    <span>Manage links</span>
  </button>

  <!-- Share viewer's own one-button equivalent of Get link/Manage links
       above — mutually exclusive with them via data-cap (shareLink is
       app-only, copyShareLink is share-only), so exactly one of the two
       ever shows. Wired in shareBoot.js. -->
  <button
    class="utilities-menu-item"
    id="copyShareLinkBtn"
    type="button"
    data-cap="copyShareLink"
  >
    <span class="material-symbols-outlined">link</span>
    <span>Copy link</span>
  </button>

  <div class="utilities-menu-divider" data-cap="libraryMenu"></div>

  <button class="utilities-menu-item" id="switchLibraryBtn" type="button" data-cap="libraryMenu">
    <span class="material-symbols-outlined">folder_open</span>
    <span>Open library</span>
  </button>

  <button class="utilities-menu-item" id="convertToLibraryBtn" type="button" data-cap="libraryMenu">
    <span class="material-symbols-outlined">bookmark_manager</span>
    <span>Convert to library</span>
  </button>

  <button class="utilities-menu-item" id="closeLibraryBtn" type="button" data-cap="libraryMenu">
    <span class="material-symbols-outlined">logout</span>
    <span>Close library</span>
  </button>

  <button class="utilities-menu-item" id="cleanOrganizeBtn" type="button" data-cap="libraryMenu">
    <span class="material-symbols-outlined">auto_fix_high</span>
    <span>Verify &amp; repair</span>
  </button>

  <div class="utilities-menu-divider" id="trashMenuDivider" hidden data-cap="libraryMenu"></div>

  <button class="utilities-menu-item" id="viewTrashBtn" type="button" data-cap="libraryMenu">
    <span class="material-symbols-outlined">delete</span>
    <span>Open trash</span>
  </button>

  <button class="utilities-menu-item" id="restoreAllTrashBtn" type="button" hidden data-cap="libraryMenu">
    <span class="material-symbols-outlined">undo</span>
    <span>Restore all</span>
  </button>

  <button class="utilities-menu-item" id="emptyTrashBtn" type="button" hidden data-cap="libraryMenu">
    <span class="material-symbols-outlined">delete_forever</span>
    <span>Empty trash</span>
  </button>
</div>
    <main class="page-main">
      <div class="page-wrapper">
        <h1 class="share-page-title" id="sharePageTitle"></h1>
        <div id="photoContainer"></div>
        <div class="share-empty" id="shareEmpty" hidden>No photos match these filters.</div>
        <div class="share-error-panel" id="shareErrorPanel">
          <div class="share-error" id="shareError" hidden></div>
          <button
            type="button"
            class="btn btn-primary share-error-retry"
            id="shareErrorRetryBtn"
            hidden
          >
            Try again
          </button>
        </div>
      </div>
    </main>
<!-- Lightbox Overlay -->
<div class="lightbox-overlay" id="lightboxOverlay" style="display: none">
  <!-- Top chrome: decorative scrim (fixed extent) + icon row.
       Icon row reuses the grid app bar's actual markup (.app-bar-wrapper /
       .app-bar-elements-layer / .actions / .app-bar-icon-button) instead
       of a parallel implementation, so sizing, centering, and
       overflow/squeeze behavior come from the same component and can't
       drift out of sync. .lightbox-top-bar / .lightbox-icon-button carry
       only the lightbox-specific deltas (transparent background, white
       icon color) — see styles.css.
       Deliberately NOT using .title-and-back for the back button: that
       class is grid's decorative title, which AppBarLayout.layout() hides
       when the bar gets crowded (title-and-back < 480px etc.) — fine for
       optional text, wrong for a close control the user must always be
       able to reach. .lightbox-back-btn gets equivalent left-aligned,
       vertically-centered positioning without going through that
       show/hide logic. -->
  <div class="lightbox-top-chrome">
    <div class="lightbox-scrim" aria-hidden="true"></div>
    <div class="app-bar-wrapper lightbox-top-bar">
      <div class="app-bar-elements-layer">
        <button
          class="app-bar-icon-button lightbox-icon-button lightbox-back-btn"
          id="lightboxBackBtn"
          aria-label="Close"
        >
          <span class="material-symbols-outlined app-bar-icon">arrow_back</span>
        </button>
        <div class="actions">
          <button
            class="app-bar-icon-button lightbox-icon-button"
            id="lightboxRotateBtn"
            aria-label="Rotate"
          >
            <span class="material-symbols-outlined app-bar-icon">rotate_left</span>
          </button>
          <button
            class="app-bar-icon-button lightbox-icon-button"
            id="lightboxEditDateBtn"
            aria-label="Edit Date"
          >
            <span class="material-symbols-outlined app-bar-icon">edit_calendar</span>
          </button>
          <button class="app-bar-icon-button lightbox-icon-button" id="lightboxStarBtn" aria-label="Star">
            <span class="material-symbols-outlined app-bar-icon">star</span>
          </button>
          <button class="app-bar-icon-button lightbox-icon-button" id="lightboxInfoBtn" aria-label="Info">
            <span class="material-symbols-outlined app-bar-icon">info</span>
          </button>
          <button
            class="app-bar-icon-button lightbox-icon-button"
            id="lightboxRestoreBtn"
            aria-label="Restore"
            title="Restore"
            hidden
          >
            <span class="material-symbols-outlined app-bar-icon">undo</span>
          </button>
          <button
            class="app-bar-icon-button lightbox-icon-button"
            id="lightboxDownloadBtn"
            aria-label="Download"
            title="Download"
          >
            <span class="material-symbols-outlined app-bar-icon">download</span>
          </button>
          <button
            class="app-bar-icon-button lightbox-icon-button"
            id="lightboxDeleteBtn"
            aria-label="Delete"
          >
            <span class="material-symbols-outlined app-bar-icon">delete</span>
          </button>

          <!-- Narrow width, app surface only (see styles.css narrow block):
               rotate/edit-date/download move into this menu instead of
               sitting inline — hidden by default (desktop + share), see
               .lightbox-icon-button below. -->
          <button
            class="app-bar-icon-button lightbox-icon-button"
            id="lightboxMoreBtn"
            aria-label="More options"
            title="More options"
          >
            <span class="material-symbols-outlined app-bar-icon">more_vert</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- More menu (narrow, app-only — see #lightboxMoreBtn above). Reuses the
       grid app bar's .utilities-menu component (styles.css) and its
       PhotoChrome.toggleUtilitiesMenu/hideUtilitiesMenu helpers instead of a
       parallel implementation; own instance since the grid's #utilitiesMenu
       id is already taken. Items call the same ctx.onRotate/onEditDate/
       onDownload as their inline counterparts — two triggers, one
       handler. -->
  <div class="utilities-menu" id="lightboxUtilitiesMenu" style="display: none">
    <button class="utilities-menu-item" id="lightboxRotateMenuBtn" type="button">
      <span class="material-symbols-outlined">rotate_left</span>
      <span>Rotate</span>
    </button>
    <button class="utilities-menu-item" id="lightboxEditDateMenuBtn" type="button">
      <span class="material-symbols-outlined">edit_calendar</span>
      <span>Change date</span>
    </button>
    <button class="utilities-menu-item" id="lightboxDownloadMenuBtn" type="button">
      <span class="material-symbols-outlined">download</span>
      <span>Download</span>
    </button>
  </div>

  <!-- Navigation chevrons. Each carries its own enlarged square hit halo
       (a ::before, side = button + 2 * --lightbox-nav-halo-pad) — the only
       pointer target for prev/next at every width. On wide, hovering the
       halo is also what reveals the chevron (see styles.css). -->
  <button
    class="lightbox-nav-btn lightbox-nav-left"
    id="lightboxPrevBtn"
    aria-label="Previous"
  >
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button
    class="lightbox-nav-btn lightbox-nav-right"
    id="lightboxNextBtn"
    aria-label="Next"
  >
    <span class="material-symbols-outlined">chevron_right</span>
  </button>

  <!-- Photo content -->
  <div class="lightbox-content" id="lightboxContent">
    <!-- Image or video will be inserted here -->
  </div>

  <!-- Info panel at bottom -->
  <div class="lightbox-info-panel" id="lightboxInfoPanel" style="display: none">
    <button class="info-close-btn" id="infoCloseBtn" aria-label="Close">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div class="info-row">
      <span class="info-label">Date:</span>
      <a href="#" class="info-value info-link" id="infoDate">-</a>
    </div>
    <div class="info-row">
      <span class="info-label">Filename:</span>
      <a href="#" class="info-value info-link" id="infoFilename">-</a>
    </div>
  </div>
</div>
<!-- Surface load overlay — scrim visible at t=0 (share hard reload SS2). -->
<div
  class="import-overlay import-overlay--scrim-only"
  id="surfaceLoadOverlay"
  style="display: flex"
  aria-hidden="false"
  data-surface-load-scrim-at=""
>
  <div class="import-card">
    <div class="import-header">
      <span class="import-title" id="surfaceLoadTitle">Loading share page</span>
    </div>

    <div class="import-progress-section">
      <div class="import-status-text">
        <span id="surfaceLoadStatusLabel">Retrieving shared photos and videos.</span>
        <span class="import-spinner" aria-hidden="true"></span>
      </div>
    </div>

    <div class="import-actions" id="surfaceLoadActions" style="display: none">
      <button class="btn btn-secondary" id="surfaceLoadCancelBtn" type="button">
        Cancel
      </button>
    </div>
  </div>
</div>
<script>
  (function () {
    var overlay = document.getElementById('surfaceLoadOverlay');
    var startedAt = performance.now();
    window.__surfaceLoadScrimAt = startedAt;
    if (overlay) {
      overlay.dataset.surfaceLoadScrimAt = String(startedAt);
    }
  })();
</script>
<!-- Toast Notification -->
<div class="toast" id="toast" style="display: none;">
  <span class="toast-message" id="toastMessage"></span>
  <button class="toast-button" id="toastUndoBtn">Undo</button>
  <button class="toast-close-btn" id="toastCloseBtn">
    <span class="material-symbols-outlined">close</span>
  </button>
</div>
<!-- Download prep progress (zip exports only) -->
<div class="import-overlay" id="downloadPrepOverlay" style="display: none">
  <div class="import-card">
    <div class="import-header">
      <span class="import-title" id="downloadPrepTitle">Preparing download</span>
    </div>

    <div class="import-progress-section">
      <div class="import-status-text" id="downloadPrepStatusText">
        Zipping<span class="import-spinner" aria-hidden="true"></span>
      </div>
      <p class="download-prep-note" id="downloadPrepNote">
        Your download will continue even if you close this window.
      </p>
    </div>

    <div class="import-actions">
      <button type="button" class="btn btn-secondary" id="downloadPrepCancelBtn">
        Cancel
      </button>
      <button type="button" class="btn btn-primary" id="downloadPrepCloseBtn">
        Close
      </button>
    </div>
  </div>
</div>
