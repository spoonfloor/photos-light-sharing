<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Photos</title>
    <!-- Generated by scripts/build-share-viewer.sh — do not edit by hand -->
    <link rel="stylesheet" href="css/material-symbols.css?v=1" />
    <link rel="stylesheet" href="css/styles.css?v=1" />
    <link rel="stylesheet" href="css/share-overrides.css?v=1" />
  </head>
  <body class="share-view filter-chip-rail-visible">
    <div id="appChromeMount">
      <div id="appBarMount">
<div class="app-bar-wrapper no-select">
  <div class="app-bar-elements-layer">
    <div class="title-and-back">
      <span class="title title-photos" id="appBarTitle">Photos Light</span>
    </div>
    <div class="date-picker" hidden aria-hidden="true"></div>
    <div class="actions">
      <button
        type="button"
        class="app-bar-icon-button"
        id="sortToggleBtn"
        aria-label="Sort"
        title="Newest first"
      >
        <span class="material-symbols-outlined app-bar-icon" id="sortIcon"
          >hourglass_arrow_down</span
        >
      </button>
      <button
        type="button"
        class="app-bar-icon-button"
        id="downloadBtn"
        aria-label="Download"
        title="Download"
      >
        <span class="material-symbols-outlined app-bar-icon">download</span>
      </button>
      <button
        type="button"
        class="app-bar-icon-button inactive"
        id="deselectAllBtn"
        aria-label="Deselect all"
        title="Deselect all"
      >
        <span class="material-symbols-outlined app-bar-icon">cancel</span>
      </button>
      <button
        type="button"
        class="app-bar-icon-button"
        id="utilitiesBtn"
        aria-label="More options"
        title="More options"
      >
        <span class="material-symbols-outlined app-bar-icon">more_vert</span>
      </button>
    </div>
  </div>
</div>
      </div>
<div class="filter-chip-rail" id="filterChipRail">
  <div class="filter-chip-rail-scroll">
    <button
      type="button"
      class="filter-chip"
      data-filter="starred"
      aria-pressed="false"
    >
      starred
    </button>
    <button
      type="button"
      class="filter-chip"
      data-filter="video"
      aria-pressed="false"
    >
      video
    </button>
  </div>
</div>
    </div>
<div class="utilities-menu" id="utilitiesMenu" style="display: none">
  <button class="utilities-menu-item" id="clearStarsBtn" type="button">
    <span class="utilities-menu-icon-composite" aria-hidden="true">
      <span class="material-symbols-outlined">hide_source</span>
      <span class="material-symbols-outlined filled">star</span>
    </span>
    <span>Clear stars</span>
  </button>
</div>
    <main class="page-main">
      <div class="page-wrapper">
        <h1 class="share-page-title" id="sharePageTitle"></h1>
        <div id="photoContainer"></div>
        <div class="share-empty" id="shareEmpty" hidden>No photos match these filters.</div>
        <div class="share-error" id="shareError" hidden></div>
      </div>
    </main>
<!-- Lightbox Overlay -->
<div class="lightbox-overlay" id="lightboxOverlay" style="display: none">
  <!-- Top bar with gradient -->
  <div class="lightbox-top-bar">
    <button
      class="lightbox-icon-button"
      id="lightboxBackBtn"
      aria-label="Close"
    >
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="lightbox-spacer"></div>
    <button
      class="lightbox-icon-button"
      id="lightboxRotateBtn"
      aria-label="Rotate"
    >
      <span class="material-symbols-outlined">rotate_left</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxEditDateBtn"
      aria-label="Edit Date"
    >
      <span class="material-symbols-outlined">edit_calendar</span>
    </button>
    <button class="lightbox-icon-button" id="lightboxStarBtn" aria-label="Star">
      <span class="material-symbols-outlined">star</span>
    </button>
    <button class="lightbox-icon-button" id="lightboxInfoBtn" aria-label="Info">
      <span class="material-symbols-outlined">info</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxRestoreBtn"
      aria-label="Restore"
      title="Restore"
      hidden
    >
      <span class="material-symbols-outlined">undo</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxDownloadBtn"
      aria-label="Download"
      title="Download"
    >
      <span class="material-symbols-outlined">download</span>
    </button>
    <button
      class="lightbox-icon-button"
      id="lightboxDeleteBtn"
      aria-label="Delete"
    >
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>

  <!-- Navigation chevrons -->
  <button
    class="lightbox-nav-btn lightbox-nav-left"
    id="lightboxPrevBtn"
    aria-label="Previous"
  >
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button
    class="lightbox-nav-btn lightbox-nav-right"
    id="lightboxNextBtn"
    aria-label="Next"
  >
    <span class="material-symbols-outlined">chevron_right</span>
  </button>

  <!-- Photo content -->
  <div class="lightbox-content" id="lightboxContent">
    <!-- Image or video will be inserted here -->
  </div>

  <!-- Info panel at bottom -->
  <div class="lightbox-info-panel" id="lightboxInfoPanel" style="display: none">
    <button class="info-close-btn" id="infoCloseBtn" aria-label="Close">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div class="info-row">
      <span class="info-label">Date:</span>
      <a href="#" class="info-value info-link" id="infoDate">-</a>
    </div>
    <div class="info-row">
      <span class="info-label">Filename:</span>
      <a href="#" class="info-value info-link" id="infoFilename">-</a>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/viewCapabilities.js"></script>
    <script src="js/photoSurface/gridTile.js"></script>
    <script src="js/photoSurface/gridSelection.js"></script>
    <script src="js/photoSurface/gridInteractions.js"></script>
    <script src="js/photoSurface/chrome.js"></script>
    <script src="js/photoSurface/simpleGrid.js"></script>
    <script src="js/photoSurface/lightboxShell.js"></script>
    <script src="js/shareBoot.js"></script>
  </body>
</html>
